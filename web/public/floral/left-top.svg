<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lt-rose" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FF8FAE"/>
      <stop offset="55%" stop-color="#C52C54"/>
      <stop offset="100%" stop-color="#7E1B36"/>
    </radialGradient>
    <radialGradient id="lt-peony" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD1E0"/>
      <stop offset="55%" stop-color="#FF5D8F"/>
      <stop offset="100%" stop-color="#C23764"/>
    </radialGradient>
    <linearGradient id="lt-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C9468"/>
      <stop offset="55%" stop-color="#396E45"/>
      <stop offset="100%" stop-color="#173D24"/>
    </linearGradient>
    <filter id="lt-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#173D24" flood-opacity="0.28"/>
    </filter>

    <symbol id="lt-f-rose" viewBox="0 0 60 60">
      <g filter="url(#lt-shadow)">
        <path d="M30 30 C18 30 10 20 14 8 C24 12 30 20 30 30Z" fill="url(#lt-rose)"/>
        <path d="M30 30 C42 30 50 20 46 8 C36 12 30 20 30 30Z" fill="url(#lt-rose)" opacity="0.96"/>
        <path d="M30 30 C30 18 22 10 10 12 C13 22 20 28 30 30Z" fill="url(#lt-rose)" opacity="0.9"/>
        <path d="M30 30 C30 18 38 10 50 12 C47 22 40 28 30 30Z" fill="url(#lt-rose)" opacity="0.9"/>
        <path d="M30 30 C22 38 22 48 30 54 C38 48 38 38 30 30Z" fill="url(#lt-rose)" opacity="0.96"/>
        <circle cx="30" cy="28" r="6.5" fill="#7E1B36"/>
        <circle cx="28.5" cy="26.5" r="2.4" fill="#FFC2D1"/>
      </g>
    </symbol>

    <symbol id="lt-f-peony" viewBox="0 0 70 70">
      <g filter="url(#lt-shadow)">
        <g fill="url(#lt-peony)">
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(0 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(51 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(103 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(154 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(206 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(257 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(309 35 35)"/>
        </g>
        <g fill="#FFE3EC" opacity="0.8">
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(30 35 35)"/>
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(150 35 35)"/>
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(270 35 35)"/>
        </g>
        <circle cx="35" cy="35" r="4.5" fill="#C23764"/>
      </g>
    </symbol>

    <symbol id="lt-f-leaf" viewBox="0 0 40 16">
      <path d="M2 8 C10 -3 30 -3 38 8 C30 19 10 19 2 8Z" fill="url(#lt-leaf)"/>
      <path d="M4 8 C14 8 26 8 36 8" stroke="#173D24" stroke-width="0.6" opacity="0.55"/>
    </symbol>

    <symbol id="lt-f-berry" viewBox="0 0 10 10">
      <circle cx="5" cy="5" r="4" fill="#D8AF47"/>
      <circle cx="3.4" cy="3.4" r="1.3" fill="#FFF0C4" opacity="0.85"/>
    </symbol>
  </defs>

  <!-- stems -->
  <g stroke="#1F4A30" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M6 6 C50 24 88 60 108 114 C122 152 116 196 88 232"/>
    <path d="M6 6 C34 42 46 84 40 128"/>
    <path d="M6 6 C60 12 106 34 138 76"/>
  </g>

  <!-- back leaves (larger, darker, set first for depth) -->
  <use href="#lt-f-leaf" width="70" height="28" transform="translate(18,30) rotate(38 35 14)" opacity="0.92"/>
  <use href="#lt-f-leaf" width="60" height="24" transform="translate(52,70) rotate(70 30 12)" opacity="0.9"/>
  <use href="#lt-f-leaf" width="66" height="26" transform="translate(86,118) rotate(100 33 13)" opacity="0.88"/>
  <use href="#lt-f-leaf" width="54" height="22" transform="translate(112,168) rotate(130 27 11)" opacity="0.85"/>

  <!-- blooms -->
  <use href="#lt-f-peony" width="92" height="92" transform="translate(60,10)"/>
  <use href="#lt-f-rose" width="66" height="66" transform="translate(4,86)"/>
  <use href="#lt-f-rose" width="46" height="46" transform="translate(94,150)" opacity="0.96"/>
  <use href="#lt-f-peony" width="52" height="52" transform="translate(46,196)" opacity="0.94"/>

  <!-- small foreground leaves + gold berries -->
  <use href="#lt-f-leaf" width="34" height="14" transform="translate(118,52) rotate(52 17 7)"/>
  <use href="#lt-f-leaf" width="30" height="12" transform="translate(26,150) rotate(-20 15 6)"/>
  <use href="#lt-f-berry" width="12" height="12" transform="translate(128,30)"/>
  <use href="#lt-f-berry" width="10" height="10" transform="translate(30,70)"/>
  <use href="#lt-f-berry" width="9" height="9" transform="translate(150,98)"/>
</svg>
