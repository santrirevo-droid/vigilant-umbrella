<svg width="600" height="190" viewBox="0 0 600 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="tc-rose" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FF8FAE"/>
      <stop offset="55%" stop-color="#C52C54"/>
      <stop offset="100%" stop-color="#7E1B36"/>
    </radialGradient>
    <radialGradient id="tc-peony" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFD1E0"/>
      <stop offset="55%" stop-color="#FF5D8F"/>
      <stop offset="100%" stop-color="#C23764"/>
    </radialGradient>
    <radialGradient id="tc-magnolia" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF5D8"/>
      <stop offset="100%" stop-color="#EAD497"/>
    </radialGradient>
    <linearGradient id="tc-leaf-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C9468"/>
      <stop offset="55%" stop-color="#396E45"/>
      <stop offset="100%" stop-color="#173D24"/>
    </linearGradient>
    <linearGradient id="tc-leaf-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C9468"/>
      <stop offset="55%" stop-color="#396E45"/>
      <stop offset="100%" stop-color="#173D24"/>
    </linearGradient>
    <filter id="tc-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#173D24" flood-opacity="0.26"/>
    </filter>

    <symbol id="tc-f-rose" viewBox="0 0 60 60">
      <g filter="url(#tc-shadow)">
        <path d="M30 30 C18 30 10 20 14 8 C24 12 30 20 30 30Z" fill="url(#tc-rose)"/>
        <path d="M30 30 C42 30 50 20 46 8 C36 12 30 20 30 30Z" fill="url(#tc-rose)" opacity="0.96"/>
        <path d="M30 30 C30 18 22 10 10 12 C13 22 20 28 30 30Z" fill="url(#tc-rose)" opacity="0.9"/>
        <path d="M30 30 C30 18 38 10 50 12 C47 22 40 28 30 30Z" fill="url(#tc-rose)" opacity="0.9"/>
        <path d="M30 30 C22 38 22 48 30 54 C38 48 38 38 30 30Z" fill="url(#tc-rose)" opacity="0.96"/>
        <circle cx="30" cy="28" r="6.5" fill="#7E1B36"/>
        <circle cx="28.5" cy="26.5" r="2.4" fill="#FFC2D1"/>
      </g>
    </symbol>

    <symbol id="tc-f-peony" viewBox="0 0 70 70">
      <g filter="url(#tc-shadow)">
        <g fill="url(#tc-peony)">
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(0 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(51 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(103 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(154 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(206 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(257 35 35)"/>
          <ellipse cx="35" cy="16" rx="12" ry="16" transform="rotate(309 35 35)"/>
        </g>
        <g fill="#FFE3EC" opacity="0.8">
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(30 35 35)"/>
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(150 35 35)"/>
          <ellipse cx="35" cy="24" rx="7" ry="9" transform="rotate(270 35 35)"/>
        </g>
        <circle cx="35" cy="35" r="4.5" fill="#C23764"/>
      </g>
    </symbol>

    <symbol id="tc-f-magnolia" viewBox="0 0 80 80">
      <g filter="url(#tc-shadow)">
        <g fill="url(#tc-magnolia)" stroke="#EAD497" stroke-width="0.5">
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(0 40 40)"/>
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(60 40 40)"/>
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(120 40 40)"/>
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(180 40 40)"/>
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(240 40 40)"/>
          <path d="M40 40 C34 24 34 8 40 2 C46 8 46 24 40 40Z" transform="rotate(300 40 40)"/>
        </g>
        <circle cx="40" cy="40" r="6" fill="#D8AF47"/>
        <circle cx="40" cy="40" r="2.5" fill="#9C7728"/>
      </g>
    </symbol>

    <symbol id="tc-f-leaf-l" viewBox="0 0 40 16">
      <path d="M2 8 C10 -3 30 -3 38 8 C30 19 10 19 2 8Z" fill="url(#tc-leaf-l)"/>
      <path d="M4 8 C14 8 26 8 36 8" stroke="#173D24" stroke-width="0.6" opacity="0.55"/>
    </symbol>
    <symbol id="tc-f-leaf-r" viewBox="0 0 40 16">
      <path d="M2 8 C10 -3 30 -3 38 8 C30 19 10 19 2 8Z" fill="url(#tc-leaf-r)"/>
      <path d="M4 8 C14 8 26 8 36 8" stroke="#173D24" stroke-width="0.6" opacity="0.55"/>
    </symbol>

    <symbol id="tc-f-berry" viewBox="0 0 10 10">
      <circle cx="5" cy="5" r="4" fill="#D8AF47"/>
      <circle cx="3.4" cy="3.4" r="1.3" fill="#FFF0C4" opacity="0.85"/>
    </symbol>
  </defs>

  <!-- trailing stems, symmetric -->
  <g stroke="#1F4A30" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M300 96 C240 82 190 90 142 116 C104 136 66 134 26 108"/>
    <path d="M300 96 C360 82 410 90 458 116 C496 136 534 134 574 108"/>
    <path d="M300 96 C286 70 280 48 286 20"/>
  </g>

  <!-- leaves, left side -->
  <use href="#tc-f-leaf-l" width="46" height="18" transform="translate(210,96) rotate(-8 23 9)" opacity="0.9"/>
  <use href="#tc-f-leaf-l" width="40" height="16" transform="translate(150,110) rotate(-18 20 8)" opacity="0.88"/>
  <use href="#tc-f-leaf-l" width="34" height="14" transform="translate(88,108) rotate(-28 17 7)" opacity="0.85"/>

  <!-- leaves, right side -->
  <use href="#tc-f-leaf-r" width="46" height="18" transform="translate(344,96) rotate(8 23 9)" opacity="0.9"/>
  <use href="#tc-f-leaf-r" width="40" height="16" transform="translate(410,110) rotate(18 20 8)" opacity="0.88"/>
  <use href="#tc-f-leaf-r" width="34" height="14" transform="translate(478,108) rotate(28 17 7)" opacity="0.85"/>

  <!-- gold berries scattered -->
  <use href="#tc-f-berry" width="10" height="10" transform="translate(178,96)"/>
  <use href="#tc-f-berry" width="10" height="10" transform="translate(412,96)"/>
  <use href="#tc-f-berry" width="8" height="8" transform="translate(114,100)"/>
  <use href="#tc-f-berry" width="8" height="8" transform="translate(478,100)"/>

  <!-- center bloom cluster -->
  <use href="#tc-f-peony" width="64" height="64" transform="translate(268,38)"/>
  <use href="#tc-f-rose" width="46" height="46" transform="translate(214,64)"/>
  <use href="#tc-f-rose" width="46" height="46" transform="translate(340,64)"/>
  <use href="#tc-f-magnolia" width="52" height="52" transform="translate(274,4)"/>
</svg>
