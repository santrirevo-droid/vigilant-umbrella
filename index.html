<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morgan &amp; Samira — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FCF8F5;
    --paper-2: #F6EDE8;
    --rose: #C56E72;
    --rose-deep: #A84E62;
    --sage: #9DB08C;
    --sage-deep: #6E8265;
    --ink: #4C3B3D;
    --ink-soft: #7A6A6A;
    --hair: rgba(168, 78, 98, .22);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100%;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ---------- nav ---------- */

  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: .9rem;
    padding: 1.5rem 1rem;
    font-size: clamp(.62rem, 1.6vw, .74rem);
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .nav a {
    color: inherit;
    text-decoration: none;
    opacity: .85;
    transition: opacity .3s ease, color .3s ease;
  }

  .nav a:hover { opacity: 1; color: var(--rose-deep); }

  .nav .dot { color: var(--hair); font-size: 1rem; }

  /* ---------- scroll-reveal mechanic ---------- */

  .reveal-track {
    position: relative;
    height: 230vh;
  }

  .reveal-stage {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    --p: 1;
    --c: 1;
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, rgba(255, 255, 255, .65), transparent 62%),
      linear-gradient(180deg, var(--paper), var(--paper-2));
  }

  .corner {
    position: absolute;
    width: clamp(190px, 34vw, 420px);
    height: auto;
    pointer-events: none;
    user-select: none;
    will-change: transform;
    filter: drop-shadow(0 14px 28px rgba(76, 59, 61, .14));
  }

  .corner--tl {
    top: -7%;
    left: -7%;
    transform-origin: top left;
    transform:
      translate(calc((1 - var(--p)) * 62%), calc((1 - var(--p)) * 42%))
      scale(calc(1 + (1 - var(--p)) * .55))
      rotate(calc((1 - var(--p)) * -7deg));
  }

  .corner--tr {
    top: -7%;
    right: -7%;
    transform-origin: top right;
    transform:
      translate(calc((1 - var(--p)) * -62%), calc((1 - var(--p)) * 42%))
      scale(calc(1 + (1 - var(--p)) * .55))
      rotate(calc((1 - var(--p)) * 7deg))
      scaleX(-1);
  }

  .corner--bl {
    bottom: -7%;
    left: -7%;
    transform-origin: bottom left;
    transform:
      translate(calc((1 - var(--p)) * 62%), calc((1 - var(--p)) * -42%))
      scale(calc(1 + (1 - var(--p)) * .55))
      rotate(calc((1 - var(--p)) * 7deg));
  }

  .corner--br {
    bottom: -7%;
    right: -7%;
    transform-origin: bottom right;
    transform:
      translate(calc((1 - var(--p)) * -62%), calc((1 - var(--p)) * -42%))
      scale(calc(1 + (1 - var(--p)) * .55))
      rotate(calc((1 - var(--p)) * -7deg))
      scaleX(-1);
  }

  .reveal-content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 1.5rem;
    opacity: var(--c);
    transform:
      translateY(calc((1 - var(--c)) * 22px))
      scale(calc(.92 + var(--c) * .08));
    will-change: transform, opacity;
  }

  .eyebrow {
    margin: 0 0 1.4rem;
    font-size: clamp(.68rem, 1.8vw, .78rem);
    letter-spacing: .42em;
    text-transform: uppercase;
    color: var(--rose-deep);
  }

  .wreath-wrap {
    position: relative;
    width: clamp(250px, 46vw, 440px);
    margin: 0 auto;
  }

  .wreath-img {
    width: 100%;
    display: block;
  }

  .wreath-names {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .05rem;
  }

  .wreath-names .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 5.2vw, 2.9rem);
    line-height: 1;
    color: var(--ink);
  }

  .wreath-names .amp {
    font-family: 'Tangerine', cursive;
    font-size: clamp(2.3rem, 7vw, 3.7rem);
    line-height: 1;
    margin: -.08em 0;
    color: var(--rose);
  }

  .save-date {
    margin-top: 1.7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .65rem;
  }

  .save-label {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    color: var(--ink-soft);
  }

  .rule {
    width: 1px;
    height: 26px;
    background: var(--hair);
  }

  .date-label {
    margin: 0;
    font-size: clamp(.72rem, 1.8vw, .8rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 2.4rem;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .5rem;
    font-size: .66rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: calc(1 - var(--p) * 2.6);
  }

  .chevron { animation: bob 1.8s ease-in-out infinite; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal-track { height: auto; }
    .reveal-stage { position: relative; top: auto; height: auto; min-height: 100vh; padding: 7rem 0 4rem; }
    .chevron { animation: none; }
  }

  @media (max-width: 640px) {
    .corner { width: clamp(150px, 48vw, 260px); }
    .corner--tl, .corner--tr { top: -4%; }
    .corner--bl, .corner--br { bottom: -4%; }
  }
</style>

  <script>
  (function () {
    var track = document.getElementById('track');
    var stage = document.getElementById('stage');

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return; // CSS defaults (--p:1 --c:1) + the reduced-motion media query already render the final open state

    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function smoothstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

    var ticking = false;

    function update() {
      var rect = track.getBoundingClientRect();
      var total = track.offsetHeight - window.innerHeight;
      var scrolled = clamp(-rect.top, 0, total);
      var p = total > 0 ? scrolled / total : 1;
      var c = smoothstep(clamp((p - 0.30) / 0.55, 0, 1));
      stage.style.setProperty('--p', p);
      stage.style.setProperty('--c', c);
      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        requestAnimationFrame(update);
        ticking = true;
      }
    }

    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick);
    update();
  })();
  </script>
